org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# IMPORTANT (Windows): Kotlin incremental compilation can break when sources live on a different drive
# (e.g. your project on D: but Pub cache on C:). Disable it to avoid "different roots" cache errors.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# Optional: can reduce Gradle concurrency issues on Windows file locks
org.gradle.parallel=true
org.gradle.configureondemand=true

org.gradle.daemon=false
org.gradle.parallel=false

# Часто решает проблему "в браузере работает, в Gradle таймаут"
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Dhttps.protocols=TLSv1.2,TLSv1.3

# Увеличим таймауты скачивания
systemProp.org.gradle.internal.http.connectionTimeout=600000
systemProp.org.gradle.internal.http.socketTimeout=600000
