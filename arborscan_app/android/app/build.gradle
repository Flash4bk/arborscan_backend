plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.arborscan_app"
    compileSdk 36

    defaultConfig {
        applicationId "com.example.arborscan_app"
        minSdk 24
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
        testInstrumentationRunner "com.example.arborscan_app.DataPreservationInstrumentation"
    }

    aaptOptions {
        noCompress "tflite"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            // Release artifacts remain unsigned until ops_android_signing.py
            // applies the private key and SDK-targeted rotation lineage. Never
            // silently publish a release signed only by the development key.
            signingConfig null
            debuggable false
        }
    }

    // Audit instrumentation uses the same non-debuggable application variant.
    // Its APK is signed separately with the same verified rotation lineage.
    testBuildType "release"
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Sceneform (maintained fork). IMPORTANT: artifactId is "ux", NOT "sceneform-ux".
    implementation "com.gorisse.thomas.sceneform:sceneform:1.23.0"
    implementation "com.gorisse.thomas.sceneform:core:1.23.0"
    implementation "com.gorisse.thomas.sceneform:ux:1.23.0"

    // API 36-compatible SDK: the old install flow crashed on receiver flags.
    // Sceneform rendering and ArborScan measurement geometry remain unchanged.
    implementation "com.google.ar:core:1.50.0"

    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"

    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'

}

flutter {
    source "../.."
}
