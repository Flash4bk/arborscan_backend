name: arborscan-v4

services:
  api-v4:
    build:
      context: ..
      dockerfile: deploy-vps/Dockerfile.v4
    image: arborscan-api-v4
    container_name: arborscan-api-v4
    restart: unless-stopped
    init: true

    env_file:
      - /etc/arborscan/arborscan.env

    environment:
      PROJECT_ROOT: /app
      MODEL_DIR: /app/models
      ACTIVE_MODEL_VERSION: "4"
      AUTO_SELECT_LATEST_LOCAL_MODEL: "true"
      V4_TREE_CONF: "0.25"
      V4_TREE_IMGSZ: "1024"
      V4_MAX_UPLOAD_MB: "15"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"

    # v3 remains on 127.0.0.1:8000.  v4 is isolated on 8001.
    ports:
      - "127.0.0.1:8001:8001"

    volumes:
      - ../models:/app/models:ro

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 512

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=8).read()"
        ]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
